[bar/main]
width = 100%
height = 25
background = #00000000
foreground = #878787

font-0 = JetBrains Mono:size=15;2

module-margin = 1
modules-left = bspwm
modules-right = date battery backlight pipewire network cpu memory temperature

[module/bspwm]
type = internal/bspwm

[module/date]
type = internal/date
interval = 1
date = %H:%M:%S

[module/battery]
type = internal/battery
battery = BAT1
adapter = AC
interval = 60
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging =BAT: +%percentage%%
label-discharging =BAT: -%percentage%%
label-full =BAT: *%percentage%%

[module/backlight]
type = internal/backlight
interval = 1
format = <label>
label =LED: %percentage%%

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
label =CPU: %percentage%%

[module/memory]
type = internal/memory
interval = 1
format = <label>
label =MEM: %percentage_used%%

[modules/network]
type = internal/network
interface = wlp3s0
interval = 1
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected =NET: %local_ip%
label-disconnected =NET: /

[module/pipewire]
type = internal/pulseaudio
format-volume = <label-volume>
format-muted = <label-muted>
label-volume =VOL: %percentage%%
label-muted =VOL: /

[module/temperature]
type = internal/temperature
interval = 1
format = <label>
label =TEMP: %temperature-c%
